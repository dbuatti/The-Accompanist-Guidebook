name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Non-secret placeholders are sufficient for `next build`: static
          # generation does not require live credentials (see src/lib/env.ts).
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NEON_AUTH_BASE_URL: https://ci.neonauth.example.com
          NEON_AUTH_COOKIE_SECRET: ci-placeholder-secret-32-characters-long
          NEXT_PUBLIC_APP_URL: https://example.com
